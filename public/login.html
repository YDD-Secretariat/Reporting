<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANCOM · Sign in</title>
<link rel="stylesheet" href="/portal.css">
<style>
  body { display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--bg,#F6F5F1); }
  .card { background:#fff; border:1px solid #DDE3DE; border-radius:16px; padding:36px 32px; max-width:420px; width:92%; box-shadow:0 18px 40px #123d3012; }
  h1 { font-family:Arial,Helvetica,sans-serif; font-size:24px; margin:0 0 8px; color:#12433A; }
  p { color:#5C6863; font-size:14px; line-height:1.5; }
  #google-button { margin:22px 0 12px; display:flex; justify-content:center; }
  #message { font-size:13px; color:#5C6863; min-height:1.4em; }
  #account { display:none; margin-top:14px; padding:12px; background:#f6f8f7; border-radius:8px; font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-family:Arial;font-size:11px;font-weight:700;color:#1B5C4F;letter-spacing:.06em;margin-bottom:6px">MANCOM REPORTING</div>
    <h1>Sign in</h1>
    <p>Use the Google account registered by the secretariat. Enrolment is email-based — no per-user ID copy step.</p>
    <div id="google-button"></div>
    <div id="message"></div>
    <div id="account"></div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
