<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANCOM · Reports</title>
<link rel="stylesheet" href="/portal.css">
<style>
.mode-pill{display:inline-flex;background:#0d332c;border-radius:999px;padding:3px;gap:2px}
.mode-pill button{border:0;background:transparent;color:#bfe0d5;font-family:Arial;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.mode-pill button.active{background:#fff;color:#12433A}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}
.stat{background:#fff;border:1px solid var(--line,#DDE3DE);border-radius:13px;padding:20px 16px}
.stat .n{font-family:Arial;font-weight:750;font-size:28px;color:#12433A}
.stat .l{font-family:Arial;font-size:11px;color:#5C6863;text-transform:uppercase;margin-top:4px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line,#DDE3DE);border-radius:13px;padding:18px}
.card h3{margin:0 0 6px;font-size:16px}
.card .meta{font-family:Arial;font-size:12px;color:#5C6863}
</style>
</head>
<body class="auth-pending">
  <div class="sessionbar">
    <div id="identity">…</div>
    <button type="button" id="signout">Sign out</button>
  </div>
  <header>
    <div class="wrap" style="padding-bottom:0">
      <div class="eyebrow">MANCOM REPORTING PORTAL</div>
      <h1>Programme reports</h1>
      <p>Area-scoped submissions. Headers normalised across programme years.</p>
    </div>
  </header>
  <div class="wrap">
    <div class="controls">
      <div class="ctl"><label>Mode</label>
        <div class="mode-pill" id="modePill">
          <button type="button" data-mode="reports" class="active">Reports</button>
          <button type="button" data-mode="feedback">Feedback</button>
        </div>
      </div>
      <div class="ctl"><label for="report">Programme</label><select id="report"></select></div>
      <div class="ctl"><label>Actions</label>
        <div class="btnrow">
          <button type="button" class="btn" id="reload">Refresh</button>
          <a class="btn secondary" href="/dashboard.html">Dashboard</a>
          <a class="btn secondary" href="/submissions.html">Submissions</a>
        </div>
      </div>
    </div>
    <div id="status">Loading…</div>
    <div class="stats" id="stats"></div>
    <div id="cards"></div>
    <div id="drop"></div>
  </div>
  <script src="/portal.js"></script>
  <script>
  (async () => {
    await Portal.ready;
    const status = document.getElementById('status');
    const reportSel = document.getElementById('report');
    let mode = sessionStorage.getItem('mancomMode') || 'reports';
    const setMode = m => {
      mode = m; sessionStorage.setItem('mancomMode', m);
      document.querySelectorAll('#modePill button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      if (m === 'feedback') location.href = '/dashboard.html';
    };
    document.getElementById('modePill').onclick = e => {
      const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode);
    };
    document.querySelectorAll('#modePill button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const num = v => { const n = Number(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; };
    const headIndex = (heads, name) => heads.findIndex(h => String(h).trim().toLowerCase() === name.toLowerCase());
    function firstPerLocation(records) {
      const heads = records[0] || [];
      const bi = headIndex(heads, 'Branch location'), ai = headIndex(heads, 'Area');
      const seen = new Set(), out = [heads];
      for (const row of records.slice(1)) {
        const key = (ai >= 0 ? row[ai] : '') + '|' + (bi >= 0 ? row[bi] : JSON.stringify(row));
        if (seen.has(key)) continue; seen.add(key); out.push(row);
      }
      return out;
    }
    function attendance(row, heads) {
      const total = num(row[headIndex(heads, 'Total')]);
      if (total) return total;
      return ['Teenage male','Teenage female','Parents','Male','Female'].reduce((s,k)=>s+num(row[headIndex(heads,k)]),0);
    }
    function blessingSum(row, heads) {
      return ['Salvation','Sanctification','Holy ghost','Healing','Re-anointing','Other blessings']
        .reduce((s,k)=>s+num(row[headIndex(heads,k)]),0);
    }
    async function load() {
      status.className = ''; status.textContent = 'Loading…';
      try {
        const key = reportSel.value || sessionStorage.getItem('mancomReport') || '';
        const data = await Portal.api('data', { query: { mode, report: key } });
        sessionStorage.setItem('mancomReport', data.selectedReport);
        reportSel.innerHTML = '';
        data.programmes.slice(1).forEach(r => {
          const opt = document.createElement('option');
          opt.value = r[0]; opt.textContent = r[2] || r[0];
          if (r[0] === data.selectedReport) opt.selected = true;
          reportSel.append(opt);
        });
        const records = firstPerLocation(data.records);
        const heads = records[0] || [], rows = records.slice(1);
        let att = 0, bless = 0;
        rows.forEach(r => { att += attendance(r, heads); bless += blessingSum(r, heads); });
        document.getElementById('stats').innerHTML =
          `<div class="stat"><div class="n">${rows.length}</div><div class="l">Locations</div></div>
           <div class="stat"><div class="n">${att}</div><div class="l">Attendance</div></div>
           <div class="stat"><div class="n">${bless}</div><div class="l">Blessings</div></div>
           <div class="stat"><div class="n">${Math.max(0,data.records.length-1)}</div><div class="l">All rows</div></div>`;
        const cards = document.getElementById('cards'); cards.replaceChildren();
        rows.forEach(r => {
          const card = document.createElement('div'); card.className = 'card';
          const area = r[headIndex(heads,'Area')] || '';
          const branch = r[headIndex(heads,'Branch location')] || '';
          const cat = r[headIndex(heads,'Category')] || '';
          card.innerHTML = `<h3>${branch||area||'Submission'}</h3><div class="meta">${area}${cat?' · '+cat:''}</div>
            <div style="margin-top:12px;font-family:Arial;font-size:13px"><strong>${attendance(r,heads)}</strong> attendance · <strong>${blessingSum(r,heads)}</strong> blessings</div>`;
          cards.append(card);
        });
        Portal.details(data.records);
        status.textContent = `Generated ${new Date(data.generatedAt).toLocaleString()} · ${data.user.role==='admin'?'All areas':data.user.area}`;
      } catch (e) { status.className = 'err'; status.textContent = e.message; }
    }
    reportSel.onchange = () => { sessionStorage.setItem('mancomReport', reportSel.value); load(); };
    document.getElementById('reload').onclick = load;
    await load();
  })();
  </script>
</body>
</html>
