<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANCOM · Dashboard</title>
<link rel="stylesheet" href="/portal.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
.mode-pill{display:inline-flex;background:#0d332c;border-radius:999px;padding:3px;gap:2px}
.mode-pill button{border:0;background:transparent;color:#bfe0d5;font-family:Arial;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.mode-pill button.active{background:#fff;color:#12433A}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}
.stat{background:#fff;border:1px solid #DDE3DE;border-radius:13px;padding:20px 16px}
.stat .n{font-family:Arial;font-weight:750;font-size:28px;color:#12433A}
.stat .l{font-family:Arial;font-size:11px;color:#5C6863;text-transform:uppercase;margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:22px 0}
.chart-card{background:#fff;border:1px solid #DDE3DE;border-radius:13px;padding:18px}
.chart-card h3{margin:0 0 12px;font-family:Arial;font-size:14px;color:#12433A}
.chart-wrap{position:relative;height:260px}
</style>
</head>
<body class="auth-pending">
  <div class="sessionbar"><div id="identity">…</div><button type="button" id="signout">Sign out</button></div>
  <header>
    <div class="wrap" style="padding-bottom:0">
      <div class="eyebrow">MANCOM · ANALYSIS</div>
      <h1 id="pageTitle">Feedback dashboard</h1>
      <p id="pageSub">Dynamic charts from Forms exports. Same area access rules.</p>
    </div>
  </header>
  <div class="wrap">
    <div class="controls">
      <div class="ctl"><label>Mode</label>
        <div class="mode-pill" id="modePill">
          <button type="button" data-mode="reports">Reports</button>
          <button type="button" data-mode="feedback" class="active">Feedback</button>
        </div>
      </div>
      <div class="ctl"><label for="report">Source</label><select id="report"></select></div>
      <div class="ctl"><label>Actions</label>
        <div class="btnrow">
          <button type="button" class="btn" id="reload">Refresh</button>
          <button type="button" class="btn secondary" id="exportPpt">Export summary</button>
          <a class="btn secondary" href="/">Reports list</a>
        </div>
      </div>
    </div>
    <div id="status">Loading…</div>
    <div class="stats" id="stats"></div>
    <div class="charts" id="charts"></div>
    <div id="insights" class="panel" style="padding:20px;margin-top:8px;display:none;background:#fff;border:1px solid #DDE3DE;border-radius:13px"></div>
    <div id="drop"></div>
  </div>
  <script src="/portal.js"></script>
  <script>
  (async () => {
    await Portal.ready;
    const status = document.getElementById('status');
    const reportSel = document.getElementById('report');
    const chartsEl = document.getElementById('charts');
    let mode = sessionStorage.getItem('mancomMode') || 'feedback';
    let chartInstances = [], lastPayload = null;
    function setModeUI() {
      document.querySelectorAll('#modePill button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      document.getElementById('pageTitle').textContent = mode === 'feedback' ? 'Feedback dashboard' : 'Reports dashboard';
      document.getElementById('pageSub').textContent = mode === 'feedback'
        ? 'Dynamic charts from Microsoft Forms / sheet exports. Area leaders see only their area.'
        : 'Attendance and blessings across programmes.';
    }
    document.getElementById('modePill').onclick = e => {
      const b = e.target.closest('button[data-mode]'); if (!b) return;
      mode = b.dataset.mode; sessionStorage.setItem('mancomMode', mode); setModeUI(); load();
    };
    setModeUI();
    function destroyCharts() { chartInstances.forEach(c => c.destroy()); chartInstances = []; chartsEl.replaceChildren(); }
    const headIndex = (heads, name) => heads.findIndex(h => String(h).trim().toLowerCase() === name.toLowerCase());
    const num = v => { const n = Number(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; };
    function counts(values) {
      const m = new Map();
      values.forEach(v => { const k = String(v ?? '').trim() || '(blank)'; m.set(k, (m.get(k) || 0) + 1); });
      return [...m.entries()].sort((a, b) => b[1] - a[1]);
    }
    function addChart(title, type, labels, data) {
      const card = document.createElement('div'); card.className = 'chart-card';
      card.innerHTML = `<h3>${title}</h3><div class="chart-wrap"><canvas></canvas></div>`;
      chartsEl.append(card);
      const palette = ['#12433A','#1B5C4F','#b48627','#5C6863','#1E7A4F','#B5541A','#3d7ea6','#8b5a2b'];
      if (typeof Chart === 'undefined') return;
      const ch = new Chart(card.querySelector('canvas'), {
        type,
        data: { labels, datasets: [{ data, backgroundColor: labels.map((_, i) => palette[i % palette.length]), borderWidth: 0 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: (type === 'pie' || type === 'doughnut') ? 'right' : 'none', labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: (type === 'pie' || type === 'doughnut') ? {} : { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      });
      chartInstances.push(ch);
    }
    function isRatingHeader(h) {
      const n = String(h).toLowerCase();
      return /rate|overall|venue|convenience|recommendation|appropriate|session|chorus|choro|opening|panel|prayer|keynote|practical|accreditation|prelude|syndicate|testimon/.test(n)
        && !/email|name|id|time|language|country|area|location|phone|start|completion/.test(n);
    }
    function renderFeedback(data) {
      const heads = data.records[0] || [], rows = data.records.slice(1), ai = headIndex(heads, 'Area');
      document.getElementById('stats').innerHTML =
        `<div class="stat"><div class="n">${rows.length}</div><div class="l">Responses</div></div>
         <div class="stat"><div class="n">${new Set(rows.map(r => r[ai])).size}</div><div class="l">Areas</div></div>
         <div class="stat"><div class="n">${heads.length}</div><div class="l">Fields</div></div>`;
      if (ai >= 0) { const c = counts(rows.map(r => r[ai])); addChart('Responses by area', 'bar', c.map(x => x[0]), c.map(x => x[1])); }
      const usable = heads.map((h, i) => ({ h, i }))
        .filter(({ h, i }) => {
          if (!isRatingHeader(h) || /^area$/i.test(h)) return false;
          const sample = rows.slice(0, 30).map(r => String(r[i] ?? ''));
          const avg = sample.reduce((s, t) => s + t.length, 0) / Math.max(sample.length, 1);
          const unique = new Set(sample.map(s => s.trim().toLowerCase())).size;
          return avg < 60 && unique <= 12 && unique >= 2;
        }).slice(0, 6);
      usable.forEach(({ h, i }) => {
        const top = counts(rows.map(r => r[i])).slice(0, 8);
        addChart(h.length > 48 ? h.slice(0, 46) + '…' : h, top.length <= 5 ? 'doughnut' : 'bar', top.map(x => x[0]), top.map(x => x[1]));
      });
      const openIdx = heads.findIndex(h => /two specific|improve|insightful|explain|suggestion|challenge/i.test(h));
      const insights = document.getElementById('insights');
      if (openIdx >= 0) {
        const samples = rows.map(r => String(r[openIdx] ?? '').trim()).filter(t => t.length > 20).slice(0, 8);
        insights.style.display = 'block';
        insights.innerHTML = `<h3 style="margin:0 0 10px;font-family:Arial;font-size:14px;color:#12433A">Open responses (sample)</h3>` +
          samples.map(t => `<p style="font-size:13px;line-height:1.45;border-left:3px solid #1B5C4F;padding-left:12px;margin:8px 0">“${t.replace(/[<>]/g,'')}”</p>`).join('');
      } else insights.style.display = 'none';
    }
    function attendance(row, heads) {
      const total = num(row[headIndex(heads, 'Total')]);
      if (total) return total;
      return ['Teenage male','Teenage female','Parents','Male','Female'].reduce((s,k)=>s+num(row[headIndex(heads,k)]),0);
    }
    function renderReports(data) {
      const heads = data.records[0] || [], rows = data.records.slice(1), ai = headIndex(heads, 'Area');
      let att = 0; const byArea = new Map();
      rows.forEach(r => { const a = attendance(r, heads); att += a; byArea.set(r[ai] || '—', (byArea.get(r[ai] || '—') || 0) + a); });
      document.getElementById('stats').innerHTML =
        `<div class="stat"><div class="n">${rows.length}</div><div class="l">Rows</div></div>
         <div class="stat"><div class="n">${att}</div><div class="l">Attendance</div></div>
         <div class="stat"><div class="n">${byArea.size}</div><div class="l">Areas</div></div>`;
      const areaEntries = [...byArea.entries()].sort((a,b)=>b[1]-a[1]);
      addChart('Attendance by area', 'bar', areaEntries.map(e => e[0]), areaEntries.map(e => e[1]));
      const blessKeys = ['Salvation','Sanctification','Holy ghost','Healing','Re-anointing','Other blessings'];
      const blessData = blessKeys.map(k => { const i = headIndex(heads, k); return i < 0 ? 0 : rows.reduce((s,r)=>s+num(r[i]),0); });
      if (blessData.some(n => n > 0)) addChart('Blessings totals', 'doughnut', blessKeys, blessData);
      document.getElementById('insights').style.display = 'none';
    }
    async function load() {
      status.className = ''; status.textContent = 'Loading…'; destroyCharts();
      try {
        if (typeof Chart === 'undefined') await new Promise(r => setTimeout(r, 300));
        const key = reportSel.value || sessionStorage.getItem('mancomReport') || '';
        const data = await Portal.api('data', { query: { mode, report: key } });
        lastPayload = data;
        sessionStorage.setItem('mancomReport', data.selectedReport);
        reportSel.innerHTML = '';
        data.programmes.slice(1).forEach(r => {
          const opt = document.createElement('option');
          opt.value = r[0]; opt.textContent = r[2] || r[0];
          if (r[0] === data.selectedReport) opt.selected = true;
          reportSel.append(opt);
        });
        if (mode === 'feedback') renderFeedback(data); else renderReports(data);
        Portal.details(data.records);
        status.textContent = `Generated ${new Date(data.generatedAt).toLocaleString()} · ${data.user.role==='admin'?'All areas':data.user.area}`;
      } catch (e) { status.className = 'err'; status.textContent = e.message; }
    }
    document.getElementById('exportPpt').onclick = () => {
      if (!lastPayload) return;
      const w = window.open('', '_blank');
      const title = (reportSel.selectedOptions[0]?.textContent || 'Summary') + ' · ' + mode;
      w.document.write(`<!DOCTYPE html><html><head><title>${title}</title>
        <style>body{font-family:Georgia,serif;color:#1C2321;padding:32px;max-width:960px;margin:auto}
        h1{font-family:Arial;color:#12433A}.stats{display:flex;gap:16px;flex-wrap:wrap}
        .stat{border:1px solid #DDE3DE;border-radius:12px;padding:16px;min-width:120px}
        .stat .n{font-family:Arial;font-size:28px;font-weight:700;color:#12433A}
        .stat .l{font-family:Arial;font-size:11px;color:#5C6863;text-transform:uppercase}
        .note{color:#5C6863;font-size:13px;margin-top:24px}</style></head><body>
        <h1>${title}</h1>
        <p class="note">Generated ${new Date().toLocaleString()} · Area scope applied · Print → Save as PDF, or screenshot charts into PowerPoint (IYC template style).</p>
        <div class="stats">${document.getElementById('stats').innerHTML}</div>
        <div style="margin-top:24px">${document.getElementById('insights').innerHTML||''}</div>
        </body></html>`);
      w.document.close();
    };
    reportSel.onchange = () => { sessionStorage.setItem('mancomReport', reportSel.value); load(); };
    document.getElementById('reload').onclick = load;
    await load();
  })();
  </script>
</body>
</html>
